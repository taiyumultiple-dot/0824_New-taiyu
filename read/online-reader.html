<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>教材線上閱讀</title><style>*{box-sizing:border-box}body{margin:0;background:#f8f3e6;color:#141414;font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif}header{min-height:76px;padding:16px clamp(18px,4vw,55px);display:flex;gap:20px;align-items:center;justify-content:space-between;border-bottom:3px solid #222;background:#fff}h1{font-size:clamp(19px,2.5vw,28px);margin:0}.back{color:#006f69;font-weight:900;text-decoration:none}.viewer{height:calc(100vh - 76px);padding:18px clamp(10px,3vw,38px)}iframe{width:100%;height:100%;border:2px solid #222;border-radius:12px;background:#fff}.loading{margin:50px;text-align:center;font-weight:800;color:#006f69}@media(max-width:560px){header{align-items:flex-start;flex-direction:column;gap:8px}.viewer{height:calc(100vh - 112px);padding:10px}}</style></head><body><header><div><p style="margin:0 0 4px;color:#007a73;font-weight:900">泰宇閩南語文｜AI 書櫃</p><h1 id="title">教材線上閱讀</h1></div><a class="back" href="../index.html">← 回到 AI 書櫃</a></header><main class="viewer"><p class="loading" id="loading">正在載入教材⋯⋯</p><iframe id="file" title="教材線上閱讀" allow="autoplay" hidden></iframe></main><script>const q=new URLSearchParams(location.search),id=q.get('id'),title=q.get('title')||'教材線上閱讀';document.title=`${title}｜AI 書櫃`;document.querySelector('#title').textContent=title;if(id){const frame=document.querySelector('#file');frame.src=`https://drive.google.com/file/d/${encodeURIComponent(id)}/preview`;frame.hidden=false;frame.addEventListener('load',()=>document.querySelector('#loading').hidden=true)}else document.querySelector('#loading').textContent='找不到教材檔案。';</script></body></html>
